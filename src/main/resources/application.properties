
spring.config.import=optional:file:.env[.properties]
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/incident_db}
spring.data.mongodb.database=incident_db
spring.data.mongodb.auto-index-creation=true
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:}
flickr.api.key=${FLICKR_API_KEY:}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4.1-mini}
